name: Docs Site

on:
  pull_request:
    paths:
      - "docs-site/**"
      - "mux/docs/**"
      - "scripts/sync-docs-site.sh"
      - ".github/workflows/docs-site.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false

      - name: Verify synced docs and build static site
        run: |
          set -euo pipefail
          bash scripts/sync-docs-site.sh --check
          test -f docs-site/dist/index.html
          test -f docs-site/dist/agents.html
          test -f docs-site/dist/protocol.html
          test -f docs-site/dist/configuration.html
          test -f docs-site/dist/comparison.html
          test -f docs-site/dist/changelog.html

      - name: Upload Pages artifact
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs-site/dist

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.configure.outcome == 'success'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
