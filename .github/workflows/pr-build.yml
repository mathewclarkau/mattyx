name: PR Build

on:
  pull_request:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    types:
      - opened
      - synchronize
      - reopened
  # Manual trigger: the pull_request webhook for this repo has been
  # intermittently stuck (2026-07-09+); workflow_dispatch gives us a
  # reliable manual run path via `gh workflow run`.
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # zig_os names the zig tarball segment (zig-<arch>-<zig_os>-
          # 0.15.2) AND the release-asset segment; exe_suffix is .exe on
          # Windows only.
          - os: ubuntu-latest
            arch: x86_64
            zig_os: linux
            exe_suffix: ""
          - os: ubuntu-24.04-arm
            arch: aarch64
            zig_os: linux
            exe_suffix: ""
          # macOS leg: Xcode CLT is preinstalled on GitHub macOS
          # runners (clang + libclang.dylib), so there is no apt/
          # LLVM step for this leg. macos-15 is arm64.
          - os: macos-15
            arch: aarch64
            zig_os: macos
            exe_suffix: ""
          # Windows leg: MSVC target. bindgen's libclang comes from the
          # preinstalled LLVM (pointed at via LIBCLANG_PATH in the
          # Windows-only step below); zig's .zip handling and the .exe
          # suffix are in bootstrap.sh's OS table and matrix math.
          - os: windows-latest
            arch: x86_64
            zig_os: windows
            exe_suffix: ".exe"
    runs-on: ${{ matrix.os }}
    # bash exists on every runner image (Git Bash on Windows), and the
    # build steps are written in bash (bootstrap.sh, perl -pi, set -euo
    # pipefail); without this the Windows default (pwsh) cannot run any
    # of them.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        if: runner.os == 'Linux'
        # ports.ubuntu.com (the arm64 mirror) has been fully unreachable
        # from GitHub's ARM runners (every IPv4/IPv6 address, every
        # retry) across multiple separate CI runs - not a one-off blip,
        # so retrying against the same mirror doesn't help. Falls back to
        # apt.llvm.org (LLVM's own repo, different infra/CDN entirely)
        # after a couple of quick attempts against the default mirror.
        # llvm.sh's own default package set (clang/lldb/lld/clangd) pulls
        # in lldb's gRPC/protobuf deps from the *still-broken* Ubuntu repo
        # - confirmed live, llvm.sh itself exits non-zero over exactly
        # that, even though every apt.llvm.org package fetched fine.
        # bindgen only needs libclang.so discoverable + a resource-dir
        # (see ghostty-vt-sys/build.rs), so run llvm.sh just for its repo
        # setup (ignore its own install/exit code) and then install only
        # clang-18/libclang-18-dev ourselves - both live entirely on
        # apt.llvm.org, no ports.ubuntu.com dependency at all.
        run: |
          for i in 1 2; do
            if sudo apt-get update && sudo apt-get install -y clang libclang-dev; then
              exit 0
            fi
            echo "attempt $i against the default mirror failed, retrying in 10s..." >&2
            sleep 10
          done
          echo "default mirror unreachable after 2 attempts; falling back to apt.llvm.org" >&2
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 18 || true
          sudo apt-get install -y clang-18 libclang-18-dev
          # ghostty-vt-sys/build.rs falls back to a plain `clang` on PATH
          # for resource-dir detection; llvm.sh doesn't register that
          # unversioned alternative by default.
          sudo ln -sf "$(command -v clang-18)" /usr/bin/clang

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Point bindgen at LLVM (Windows)
        # windows-latest ships LLVM at C:\Program Files\LLVM with clang
        # on PATH but not always discoverable by libclang-sys's probing;
        # LIBCLANG_PATH is the documented override. ghostty-vt-sys/build.rs
        # separately probes `clang` on PATH for the resource-dir headers,
        # which the same install provides.
        if: runner.os == 'Windows'
        run: |
          if [ -d "/c/Program Files/LLVM/bin" ]; then
            echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
          else
            echo "::warning::C:\\Program Files\\LLVM\\bin not found; relying on libclang-sys PATH probing"
          fi

      - name: Bootstrap (fetch zig 0.15.2)
        # MTYX_GHOSTTY_VT_ZIG_CPU=baseline matches the release build —
        # pins the zig VT-library to a portable CPU baseline so PR builds
        # reproduce the same codegen that ships. See release.yml Build
        # step and ghostty-vt-sys/build.rs:50-57 (issue #58 SIGILL fix).
        env:
          MTYX_GHOSTTY_VT_ZIG_CPU: baseline
        run: |
          ./scripts/bootstrap.sh
          echo "ZIG=$GITHUB_WORKSPACE/.tools/zig-${{ matrix.arch }}-${{ matrix.zig_os }}-0.15.2/zig${{ matrix.exe_suffix }}" >> "$GITHUB_ENV"

      # Pin cargo to the Rust 1.97 toolchain via rustup's "+toolchain"
      # syntax. dtolnay/rust-toolchain installs Rust 1.97 under ~/.cargo
      # but the CI image's PATH may still surface an older system cargo
      # first (1.74 on ubuntu-22.04, 1.82 on ubuntu-24.04). Older cargo
      # < 1.78 cannot read Cargo.lock v4, which cargo 1.97+ emits by
      # default. The "+1.97" prefix routes through rustup regardless of
      # PATH ordering. See AGENTS.md "Pinned toolchain" for the rust pin
      # and scripts/bootstrap.sh for the matching local-build fix.
      - name: Cargo check (mux-tui)
        working-directory: mux
        run: cargo +1.97 check -p mux-tui

      # Tests that read std::env::temp_dir() are sensitive to a leaked or
      # unwritable $TMPDIR; pin it to /tmp so the suite is deterministic on
      # the runner (see mux/docs/getting-started.md > Sessions and sockets).
      - name: Cargo test (mux-tui)
        working-directory: mux
        env:
          TMPDIR: /tmp
        run: cargo +1.97 test -p mux-tui

      - name: Cargo test (mux-core)
        working-directory: mux
        env:
          TMPDIR: /tmp
        run: cargo +1.97 test -p mux-core

      - name: Setup Go
        if: runner.os != 'Windows'
        uses: actions/setup-go@v5
        with:
          go-version-file: daemon/remote/go.mod

      - name: Go daemon tests (daemon/remote)
        if: runner.os != 'Windows'
        working-directory: daemon/remote
        run: go test ./...

      # Windows parity integration tests with live diagnostics. Round 8
      # (run 35394419102): a hung ConPTY read suppressed this binary's
      # failure summary, so two sibling failures printed nothing at all.
      # The parity tests are now deadline-bounded and stage-traced; this
      # re-run streams those traces (--nocapture) and serialises the
      # four tests (--test-threads=1) so a failure's output can't be
      # interleaved away. Scoped to the Windows leg; the other three
      # legs' steps are unchanged. Costs seconds when green.
      - name: Windows parity tests (streaming diagnostics)
        if: runner.os == 'Windows'
        working-directory: mux
        run: cargo +1.97 test -p mux-tui --test windows_parity -- --nocapture --test-threads=1
