name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # zig_os names both the zig tarball segment and the release
          # asset segment (mtyx-<zig_os>-<arch>); exe_suffix is .exe on
          # Windows only.
          - os: ubuntu-latest
            arch: x86_64
            zig_os: linux
            exe_suffix: ""
          - os: ubuntu-24.04-arm
            arch: aarch64
            zig_os: linux
            exe_suffix: ""
          # macOS leg: Xcode CLT is preinstalled on GitHub macOS
          # runners (clang + libclang.dylib), so there is no LLVM install
          # step for this leg. macos-15 is arm64.
          - os: macos-15
            arch: aarch64
            zig_os: macos
            exe_suffix: ""
          # Windows leg (MSVC): bindgen's libclang comes from the
          # preinstalled LLVM (LIBCLANG_PATH step below); the .exe
          # suffix flows through bootstrap.sh, the packaging step and
          # the asset name (mtyx-windows-x86_64.exe).
          - os: windows-latest
            arch: x86_64
            zig_os: windows
            exe_suffix: ".exe"
    runs-on: ${{ matrix.os }}
    # bash exists on every runner image (Git Bash on Windows), and the
    # build steps are written in bash (bootstrap.sh, perl -pi,
    # set -euo pipefail); without this the Windows default (pwsh)
    # cannot run any of them.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Tags are not fetched at the default depth, and
          # mux-core/build.rs falls back to `git describe` whenever
          # MTYX_VERSION is unset (i.e. workflow_dispatch runs). Tag refs
          # are a few KB — far cheaper than fetch-depth: 0, which would
          # also deepen the ghostty submodule.
          #
          # Only on non-tag runs, though: checking out a tag ref already
          # fetches `+<sha>:refs/tags/<tag>`, and fetch-tags adds the
          # `refs/tags/*` refspec on top, so git aborts the whole checkout
          # with "Cannot fetch both <sha> and refs/tags/<tag> to
          # refs/tags/<tag>" (actions/checkout#1467). That combination
          # broke the v0.17.3 release outright. Tag runs don't need any of
          # it: the step below resolves the version from GITHUB_REF_NAME
          # and build.rs never reaches its `git describe` tier.
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Resolve version from the release tag
        # The pushed tag is the single source of truth for a release; no
        # human bumps anything in-tree. That is the whole fix for issue
        # #71 — mux-tui/Cargo.toml sat at 0.1.0 for seventeen releases
        # precisely because it relied on someone remembering.
        # mux-core/build.rs bakes $MTYX_VERSION into the binary; the
        # manifest rewrite on top keeps `cargo metadata` and build.rs's
        # own no-git fallback honest for this build. workflow_dispatch
        # runs have no tag, so this stays empty and build.rs falls
        # through to `git describe`.
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "not a tag build; leaving the version to git describe"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Anchored to the start of the line so it can only match
          # [workspace.package]'s own key, never a
          # `foo = { version = "1" }` dependency line. perl instead of
          # sed -i because BSD sed (macOS legs) has no `0,/re/` address
          # form and a different -i syntax; perl -pi is identical on
          # GNU/Linux, macOS and Windows runners.
          # `\r?$` + [^"]*: Windows checkouts materialise text files
          # with CRLF (autocrlf; see also .gitattributes), so tolerate
          # a trailing CR and rewrite the line LF-only, keeping the
          # grep -qx gate below exact.
          MTYX_EXPECTED_VERSION="$version" perl -pi -e '
            if (!$done && /^version = "[^"]*"\r?$/) {
              $_ = qq(version = "$ENV{MTYX_EXPECTED_VERSION}"\n);
              $done = 1;
            }
          ' mux/Cargo.toml
          grep -qx "version = \"$version\"" mux/Cargo.toml \
            || { echo "::error::failed to sync mux/Cargo.toml to $version"; exit 1; }
          echo "release version: $version"

      - name: Install build dependencies
        # Linux legs only: the apt/llvm.org dance below is meaningless
        # on macOS (Xcode CLT preinstalled) and Windows (LLVM handled in
        # its own leg).
        if: runner.os == 'Linux'
        # ports.ubuntu.com (the arm64 mirror) has been fully unreachable
        # from GitHub's ARM runners (every IPv4/IPv6 address, every
        # retry) across multiple separate CI runs on this repo's
        # pr-build.yml - not a one-off blip, so retrying against the same
        # mirror doesn't help. Falls back to apt.llvm.org (LLVM's own
        # repo, different infra/CDN entirely) after a couple of quick
        # attempts against the default mirror. llvm.sh's own default
        # package set (clang/lldb/lld/clangd) pulls in lldb's
        # gRPC/protobuf deps from the *still-broken* Ubuntu repo -
        # confirmed live, llvm.sh itself exits non-zero over exactly that,
        # even though every apt.llvm.org package fetched fine. bindgen
        # only needs libclang.so discoverable + a resource-dir (see
        # ghostty-vt-sys/build.rs), so run llvm.sh just for its repo setup
        # (ignore its own install/exit code) and then install only
        # clang-18/libclang-18-dev ourselves - both live entirely on
        # apt.llvm.org, no ports.ubuntu.com dependency at all.
        run: |
          for i in 1 2; do
            if sudo apt-get update && sudo apt-get install -y clang libclang-dev; then
              exit 0
            fi
            echo "attempt $i against the default mirror failed, retrying in 10s..." >&2
            sleep 10
          done
          echo "default mirror unreachable after 2 attempts; falling back to apt.llvm.org" >&2
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 18 || true
          sudo apt-get install -y clang-18 libclang-18-dev
          # ghostty-vt-sys/build.rs falls back to a plain `clang` on PATH
          # for resource-dir detection; llvm.sh doesn't register that
          # unversioned alternative by default.
          sudo ln -sf "$(command -v clang-18)" /usr/bin/clang

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Point bindgen at LLVM (Windows)
        # windows-latest ships LLVM at C:\Program Files\LLVM with clang
        # on PATH but not always discoverable by libclang-sys's probing;
        # LIBCLANG_PATH is the documented override.
        if: runner.os == 'Windows'
        run: |
          if [ -d "/c/Program Files/LLVM/bin" ]; then
            echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
          else
            echo "::warning::C:\\Program Files\\LLVM\\bin not found; relying on libclang-sys PATH probing"
          fi

      - name: Build
        # MTYX_GHOSTTY_VT_ZIG_CPU=baseline pins the zig VT-library build
        # to a portable CPU baseline instead of the GitHub runner's native
        # ISA. Without this, zig's default target detection selects
        # runner-native SIMD extensions (e.g. AVX-512 variants on
        # ubuntu-latest x86_64) that SIGILL on user CPUs lacking them —
        # the root cause of issue #58's "Host 1" SIGILL failure mode.
        # See ghostty-vt-sys/build.rs:50-57 for the -Dcpu mechanism.
        env:
          MTYX_GHOSTTY_VT_ZIG_CPU: baseline
          # Empty on workflow_dispatch; mux-core/build.rs treats an empty
          # value as unset and falls back to `git describe`.
          MTYX_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/bootstrap.sh

      - name: Verify the baked-in version
        # Fail the release rather than publish a binary that lies about
        # what it is. This is the gate that makes issue #71 unable to
        # recur silently: every link in the chain (tag → MTYX_VERSION →
        # build.rs → mux_core::VERSION → `-V`) is exercised here.
        # Passed via env rather than interpolated into the script, so a
        # tag name can never be spliced into the shell.
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          reported="$(mux/target/release/mtyx${{ matrix.exe_suffix }} --version)"
          echo "mtyx reports: $reported"
          if [[ -n "$EXPECTED_VERSION" && "$reported" != "mtyx $EXPECTED_VERSION" ]]; then
            echo "::error::expected 'mtyx $EXPECTED_VERSION', got '$reported'"
            exit 1
          fi

      - name: Package binary
        run: |
          mkdir -p dist
          cp "mux/target/release/mtyx${{ matrix.exe_suffix }}" \
            "dist/mtyx-${{ matrix.zig_os }}-${{ matrix.arch }}${{ matrix.exe_suffix }}"

      - name: Mark binary executable
        # Meaningless on Windows (no exec bit); the zip already carries
        # the right attributes.
        if: runner.os != 'Windows'
        run: chmod +x "dist/mtyx-${{ matrix.zig_os }}-${{ matrix.arch }}${{ matrix.exe_suffix }}"

      - name: Generate sha256 sidecar
        # Issue #90: every shipped artifact gets a `<asset>.sha256`
        # sidecar. scripts/sha256.sh papers over the fact that the four
        # runner families disagree on which sha256 tool exists
        # (sha256sum on Linux/Git Bash, shasum on macOS).
        run: |
          set -euo pipefail
          bash scripts/sha256.sh gen \
            "dist/mtyx-${{ matrix.zig_os }}-${{ matrix.arch }}${{ matrix.exe_suffix }}"

      - name: Verify sha256 sidecar before upload
        # Verify here, in the *build* leg, so a corrupt/truncated
        # artifact fails the release before it is ever uploaded — for
        # draft and unpublished builds too (no condition on tag).
        run: |
          set -euo pipefail
          bash scripts/sha256.sh verify dist

      - uses: actions/upload-artifact@v4
        with:
          name: mtyx-${{ matrix.zig_os }}-${{ matrix.arch }}
          path: dist/mtyx-${{ matrix.zig_os }}-${{ matrix.arch }}${{ matrix.exe_suffix }}

      - uses: actions/upload-artifact@v4
        # Sidecars ride in their own artifact. A separate step (rather
        # than widening the binary artifact's `path:`) keeps this change
        # purely additive to the shipped release flow; the release job's
        # `download-artifact` already merges every artifact into dist/,
        # so the sidecar lands next to the binary there.
        with:
          name: mtyx-${{ matrix.zig_os }}-${{ matrix.arch }}-sha256
          path: dist/mtyx-${{ matrix.zig_os }}-${{ matrix.arch }}${{ matrix.exe_suffix }}.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Needed only so the additive checksum-verification step below
        # can reuse scripts/sha256.sh (identical logic to the build
        # legs). The build matrix already produced every byte we publish.
        with:
          submodules: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify sha256 sidecars before publish
        # Issue #90: gate publication on the checksums matching the
        # downloaded bytes, so the release can never ship an asset whose
        # sidecar disagrees. This step is unconditional within the
        # release job (which itself only runs for tag builds), and an
        # empty sidecar set is an error rather than a silent skip.
        run: |
          set -euo pipefail
          bash scripts/sha256.sh verify dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
