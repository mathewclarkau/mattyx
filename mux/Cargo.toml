[workspace]
resolver = "2"
members = [
    "crates/ghostty-vt-sys",
    "crates/ghostty-vt",
    "crates/mux-cdp",
    "crates/mux-core",
    "crates/mux-tui",
]

[workspace.package]
# Fallback only. The authoritative version of a release is the pushed
# `v*` tag, which release.yml feeds to mux-core/build.rs (issue #71);
# this value is what a no-git source tarball falls back to. release.yml
# rewrites it to match the tag before building, so it never has to be
# bumped by hand.
version = "0.17.2"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/mathewclarkau/mattyx"
publish = false

[workspace.dependencies]
ghostty-vt-sys = { path = "crates/ghostty-vt-sys" }
ghostty-vt = { path = "crates/ghostty-vt" }
mux-core = { path = "crates/mux-core" }
mux-cdp = { path = "crates/mux-cdp" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
portable-pty = "0.9"
wasmtime = { version = "27", default-features = false, features = ["cranelift", "runtime"] }
wasmtime-wasi = { version = "36", default-features = false, features = ["preview1"] }
crossterm = "0.28"
ratatui = "0.29"
unicode-width = "0.2"
base64 = "0.22"
libc = "0.2"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
uds_windows = "1.2"
regex = "1"

[profile.release]
lto = "thin"
strip = true

# Debug builds are what mux-dev dogfood runs; opt-level 0 makes the
# per-frame render/diff path visibly laggy. Light optimization for our
# code, full for dependencies (ratatui/crossterm do the heavy lifting).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
